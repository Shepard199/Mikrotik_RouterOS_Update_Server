name: .NET Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        dotnet-version: ['9.0.x']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      
      - name: Display .NET version
        run: dotnet --version
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build (Debug)
        run: dotnet build -c Debug --no-restore --verbosity normal
      
      - name: Build (Release)
        run: dotnet build -c Release --no-restore --verbosity normal
      
      - name: Run .NET compiler checks
        run: dotnet build -c Release --no-restore --nologo
  
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Analyze code for issues
        run: dotnet build -c Release --no-restore /p:TreatWarningsAsErrors=false /p:EnforceCodeStyleInBuild=true
        continue-on-error: true

  security-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Check NuGet packages for vulnerabilities
        run: dotnet list package --vulnerable
        continue-on-error: true
      
      - name: Restore project dependencies
        run: dotnet restore

  container-build:
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mikrotik-updateserver:test
